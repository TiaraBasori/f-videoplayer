name: F Video Player

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: f-videoplayer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.2
  CORE: packages/f_videoplayer
  FVP_ADAPTER: packages/f_videoplayer_fvp
  PIP: packages/f_videoplayer_pip
  EXAMPLE: packages/f_videoplayer/example

jobs:
  sdk-tests:
    name: MDK tool tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test MDK resolution, integrity and freshness without network
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s third_party/fvp/darwin/fvp/tool/tests -p '*_test.py' -v

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify source-only repository and notices
        shell: bash
        run: |
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md
          test -f third_party/fvp/LICENSE
          if find . -type f \( -name '*.so' -o -name '*.dll' -o -name '*.dylib' -o -name '*.a' \) -print -quit | grep -q .; then
            echo 'Native runtime binary committed to source repository' >&2
            exit 1
          fi
          # The Apple SDK is resolved per build (see the README note on MDK's
          # 44-day key-free window); a committed xcframework would be the pin
          # that expires, and CI must not accept one.
          if find third_party/fvp -name '*.xcframework' -print -quit | grep -q .; then
            echo 'Apple MDK SDK committed to source repository' >&2
            exit 1
          fi
      - name: Analyze and test core
        working-directory: ${{ env.CORE }}
        run: flutter pub get && flutter analyze --fatal-infos && flutter test
      - name: Analyze and test FVP adapter
        working-directory: ${{ env.FVP_ADAPTER }}
        run: flutter pub get && flutter analyze --fatal-infos && flutter test
      - name: Analyze and test Picture in Picture
        working-directory: ${{ env.PIP }}
        run: flutter pub get && flutter analyze --fatal-infos && flutter test
      - name: Analyze and test example
        working-directory: ${{ env.EXAMPLE }}
        run: flutter pub get && flutter analyze --fatal-infos && flutter test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build web example
        working-directory: ${{ env.EXAMPLE }}
        run: flutter build web --release

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Android example
        working-directory: ${{ env.EXAMPLE }}
        run: flutter build apk --debug
      - name: Test Android Picture in Picture lifecycle
        working-directory: ${{ env.EXAMPLE }}/android
        run: ./gradlew :f_videoplayer_pip:testDebugUnitTest

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare verified Apple MDK before SwiftPM resolution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 third_party/fvp/darwin/fvp/tool/mdk_apple_freshness.py --destination third_party/fvp/darwin/fvp/mdk.xcframework refresh
          python3 third_party/fvp/darwin/fvp/tool/mdk_apple_freshness.py --destination third_party/fvp/darwin/fvp/mdk.xcframework check
      - name: Build iOS simulator example
        working-directory: ${{ env.EXAMPLE }}
        run: flutter build ios --simulator --debug
      - name: Recheck SDK and build unsigned iOS release example
        run: |
          python3 third_party/fvp/darwin/fvp/tool/mdk_apple_freshness.py --destination third_party/fvp/darwin/fvp/mdk.xcframework check
          cd "$EXAMPLE"
          flutter build ios --release --no-codesign

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            command: flutter build linux --debug
          - name: macOS
            os: macos-latest
            command: flutter build macos --release
          - name: Windows
            os: windows-latest
            command: flutter build windows --debug
    name: ${{ matrix.name }} example
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libjpeg-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable Swift Package Manager
        if: runner.os == 'macOS'
        run: flutter config --enable-swift-package-manager
      - uses: actions/setup-python@v6
        if: runner.os == 'macOS'
        with:
          python-version: '3.12'
      - name: Prepare verified Apple MDK before SwiftPM resolution
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 third_party/fvp/darwin/fvp/tool/mdk_apple_freshness.py --destination third_party/fvp/darwin/fvp/mdk.xcframework refresh
          python3 third_party/fvp/darwin/fvp/tool/mdk_apple_freshness.py --destination third_party/fvp/darwin/fvp/mdk.xcframework check
      - name: Build desktop example
        working-directory: ${{ env.EXAMPLE }}
        run: ${{ matrix.command }}
