name: f_videoplayer
description: Responsive Flutter video player with accessible controls and independent desktop windows.
version: 0.5.9
publish_to: none
homepage: https://github.com/iebb/f-videoplayer
repository: https://github.com/iebb/f-videoplayer
issue_tracker: https://github.com/iebb/f-videoplayer/issues
topics:
  - video
  - media
  - player
  - desktop
  - accessibility

environment:
  sdk: ^3.12.2

dependencies:
  fc_native_video_thumbnail: ^3.0.1
  flutter:
    sdk: flutter
  multi_window_manager: ^1.3.0
  video_player: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
